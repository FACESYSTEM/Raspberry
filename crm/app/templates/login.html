{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block anon %}
<div class="authbox">
  {% include "_logo.html" %}
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}

  <div class="card">
    <h2>ログイン</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="authfld">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" placeholder="メールアドレス"
             autocomplete="username" required autofocus>
      </div>
      <div class="authfld">
        <label for="pw">パスワード</label>
        <div class="pwline">
          <input id="pw" name="password" type="password" placeholder="パスワード"
                 autocomplete="current-password" required>
          <button class="btn" type="button" data-pw="pw" aria-pressed="false">表示</button>
        </div>
      </div>
      <button class="btn primary wide" type="submit">ログイン</button>
    </form>
  </div>

  <div class="authfoot">
    <a href="{{ url_for('auth.forgot') }}">パスワードを忘れた方</a>
  </div>
</div>
{% endblock %}
{% block script %}{% include "_pw_toggle.html" %}{% endblock %}
