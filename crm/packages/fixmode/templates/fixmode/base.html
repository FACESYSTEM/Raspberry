{# 土台の画面が無いときの、最低限の枠。
   **持っていく先に base.html が無くても一覧が出る**ようにする。
   `init_app(base_template="base.html")` を渡せば、土台の画面に載る。 #}
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('fixmode.static', filename='fixmode.css') }}">
<style>
  body{margin:0;padding:24px;background:#f7f7f5;color:#1c1b19;line-height:1.7;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:14px}
  .card{background:#fff;border:1px solid var(--fix-line);border-radius:10px;
    padding:20px;margin:0 auto 16px;max-width:1000px}
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--fix-line);
    vertical-align:top}
  .hint{color:var(--fix-muted);font-size:12.5px}
  .btn{border:1px solid var(--fix-line);background:#fff;border-radius:7px;
    padding:6px 14px;cursor:pointer;font-size:13px}
  .btn.primary{background:var(--fix-accent);border-color:var(--fix-accent);color:#fff}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  .quoted{border-left:3px solid var(--fix-line);padding-left:10px;margin-bottom:6px;
    color:var(--fix-ink2);font-size:12.5px}
  .reopened{margin-top:5px;color:var(--fix-serious);font-size:12.5px}
  .fixednote{margin-top:5px;color:var(--fix-good);font-size:12.5px}
</style>
</head>
<body>{% block content %}{% endblock %}</body>
</html>
